[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"
[project]
name = "buildsol"
version = "0.1.1"
description = "Official Sol SDK: streaming speech, voices, transcription and translation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Sol"}]
dependencies = ["httpx>=0.27,<1", "websockets>=14,<18", "typing-extensions>=4.12"]
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed", "Operating System :: OS Independent"]
[project.urls]
Homepage = "https://www.buildsol.ai"
Documentation = "https://www.buildsol.ai/docs#sdks"
Repository = "https://github.com/hectordiazgomez/sol-sdks"
Issues = "https://github.com/hectordiazgomez/sol-sdks/issues"
[tool.hatch.build.targets.wheel]
packages = ["src/buildsol"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "build>=1.2", "twine>=6", "ruff>=0.9", "mypy>=1.14"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
